    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- 変数定義 --- */
        :root {
            --primary-color: #ff0055;
            --secondary-color: #330000;
            --accent-color: #00e6e6;
            --bg-color: #050000;
            --text-color: #ffcccc;
            --terminal-bg: rgba(10, 0, 0, 0.95);
            --snake-color: #aa00ff; /* 蛇モード用 */
            --poison-color: #00ff00; /* 蛇モード用 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Share Tech Mono', 'Noto Sans JP', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 2s ease;
        }

        /* --- Snake Mode Styles --- */
        body.snake-mode {
            --primary-color: #bf00ff;
            --bg-color: #0a0014;
            --text-color: #e0b0ff;
            --terminal-bg: rgba(20, 0, 30, 0.95);
        }
        body.snake-mode .scanlines {
            background: linear-gradient(to bottom, rgba(0,255,0,0.1), rgba(0,0,0,0) 50%);
            background-size: 100% 4px;
        }
        body.snake-mode .terminal-header {
            background: #1a0022;
            color: var(--poison-color);
            border-bottom: 1px solid var(--snake-color);
        }
        body.snake-mode .prompt-text {
            color: var(--poison-color) !important;
        }

        /* ============================================================
           CINEMATIC LAYER — breach / dive states
           (driven by kit/cinematic.js; these are the page-side looks)
           ============================================================ */
        #kero-fx{ position:fixed; inset:0; z-index:24; pointer-events:none; opacity:0;
                  transition:opacity .45s ease-out; }
        body.kero-breach #kero-fx{ opacity:1; }
        body.kero-serpent #kero-fx{ opacity:.55; }

        .terminal-container{ transform-origin:50% 50%; }
        /* the clamp is beat-locked: 560ms per constriction, three of them */
        body.kero-clamping .terminal-container{ animation:kero-clamp 560ms cubic-bezier(.5,0,.3,1) 3; }
        @keyframes kero-clamp{
          0%,100%{ transform:scale(1,1) skewX(0); filter:none; }
          26%{ transform:scale(1.035,.975) skewX(-.7deg); filter:brightness(1.12); }
          62%{ transform:scale(.9,1.055) skewX(2.1deg);  filter:brightness(1.85) contrast(1.25); }
          78%{ transform:scale(1.06,.93) skewX(-1.4deg); filter:brightness(1.2); }
        }
        body.kero-serpent .terminal-container{
          border-color:rgba(191,0,255,.72);
          box-shadow:0 0 0 1px rgba(191,0,255,.2), 0 0 70px rgba(160,0,255,.34),
                     inset 0 0 90px rgba(110,0,190,.16);
        }
        body.kero-dive .terminal-container{ border-color:#00ffa2; box-shadow:0 0 90px rgba(0,255,162,.35), inset 0 0 60px rgba(0,255,162,.1); }
        body.kero-dive #bg-canvas{ opacity:1 !important; }
        body.kero-serpent{
          background-image:radial-gradient(ellipse at 50% 44%, #190030 0%, #0a0016 52%, #04000a 100%);
        }
        body.kero-serpent .crt-overlay{ background:radial-gradient(circle, rgba(0,0,0,0) 48%, rgba(70,0,110,.5) 100%); }
        body.kero-serpent .scanlines{
          background:repeating-linear-gradient(to bottom, rgba(191,0,255,.055) 0 1px, transparent 1px 4px);
          animation:kero-breath 5.2s ease-in-out infinite;
        }
        body.kero-serpent .terminal-header{ background:linear-gradient(90deg,#1a0022,#2b0040 60%,#1a0022); }
        @keyframes kero-breath{ 0%,100%{opacity:1} 50%{opacity:.55} }

        /* the abyss entrance — drawn in, not pasted */
        .kero-dive-link{
          display:inline-flex; align-items:center; gap:.7em; margin-top:.4rem;
          font-family:'Orbitron',sans-serif; font-weight:700; font-size:.92rem; letter-spacing:.24em;
          color:#00ffa2; text-decoration:none; padding:.72em 1.35em; position:relative;
          border:1px solid rgba(0,255,162,.55); background:rgba(0,40,30,.35);
          clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
          overflow:hidden; opacity:0; animation:kero-reveal .9s cubic-bezier(.16,1,.3,1) .2s forwards;
          transition:color .3s, box-shadow .3s, transform .3s, background .3s;
        }
        .kero-dive-link::before{
          content:""; position:absolute; inset:0;
          background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 48%,transparent 62%);
          transform:translateX(-120%); animation:kero-sheen 3.4s ease-in-out 1.1s infinite;
        }
        .kero-dive-link:hover{ color:#000; background:#00ffa2; box-shadow:0 0 34px rgba(0,255,162,.65); transform:translateY(-2px) }
        .kero-dive-link i{ animation:kero-pulse 1.5s ease-in-out infinite; }
        @keyframes kero-reveal{ from{opacity:0; transform:translateY(14px) scale(.94); filter:blur(6px)} to{opacity:1; transform:none; filter:none} }
        @keyframes kero-sheen{ 0%{transform:translateX(-120%)} 55%,100%{transform:translateX(220%)} }
        @keyframes kero-pulse{ 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.8)} }

        /* glyph-materialised serpent ASCII */
        .kero-ascii{ position:relative; margin:0; font-size:8px; line-height:9px; font-weight:700;
                     color:#d000ff; text-shadow:0 0 8px rgba(208,0,255,.75); }
        .kero-ascii .g{ display:inline-block; opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(.6);
                        filter:blur(5px); animation:g-materialize .46s cubic-bezier(.16,1,.3,1) var(--d) forwards; }
        .kero-ascii .g.set{ color:#eafff2; text-shadow:0 0 10px rgba(191,0,255,.9); }
        @keyframes g-materialize{ to{ opacity:1; transform:none; filter:none } }

        /* verdict banners inside the log */
        .kero-badged{ display:inline-block; font-family:'Orbitron',sans-serif; letter-spacing:.22em; font-size:.66rem;
                      padding:.3em .7em; border:1px solid currentColor; }
        .kero-shake-line{ animation:kero-linejit .34s steps(2) 2 }
        html.kero-black, html.kero-black body{ background:#000!important; }
        html.kero-black body{ opacity:0!important; }
        body.kero-breach .terminal-container, body.kero-serpent .terminal-container{
          transition: box-shadow .6s cubic-bezier(.16,1,.3,1), border-color .6s ease, background .8s ease;
        }
        @keyframes kero-linejit{ 0%{transform:translateX(0)} 25%{transform:translateX(-7px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)} 100%{transform:translateX(0)} }

        /* --- 背景エフェクト --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
            transition: opacity 1.1s ease, filter 1.1s ease;
            filter: saturate(1.1);
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 60%, rgba(50,0,0,0.4) 100%);
            z-index: 11;
            pointer-events: none;
        }

        /* --- ターミナルコンテナ --- */
        .terminal-container {
            width: 900px;
            max-width: 95%;
            height: 600px;
            max-height: 90vh;
            background: var(--terminal-bg);
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 20;
            transition: all 1s ease;
        }

        .terminal-header {
            background: #1a0005;
            border-bottom: 1px solid var(--primary-color);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--primary-color);
        }

        .status-badge {
            background: var(--primary-color);
            color: #000;
            padding: 2px 6px;
            font-weight: bold;
            border-radius: 2px;
            font-size: 0.7rem;
        }

        .terminal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.4;
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
        }

        /* --- テキスト装飾 --- */
        .line { margin-bottom: 5px; word-break: break-all; }
        .prompt-text { color: var(--primary-color); margin-right: 10px; }
        .success { color: #00ffaa; }
        .error { color: #ff3333; }
        .warning { color: #ffaa00; }
        .system { color: #888; font-style: italic; }
        .encrypted { color: #ff0055; text-shadow: 0 0 5px red; }
        
        .binary-highlight { color: #00e6e6; font-weight: bold; }
        .hex-highlight { color: #ffcc00; font-weight: bold; }
        .hidden-clue { color: #444; } /* 選択しないと見づらい色 */
        
        /* 蛙メッセージ用 */
        .frog-msg { color: #aaff00; }
        
        /* 蛇メッセージ用 */
        .snake-msg { color: #d000ff; text-shadow: 0 0 5px #d000ff; }

        /* --- 入力エリア --- */
        .input-line {
            display: flex;
            align-items: center;
        }
        
        #cmd-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            flex: 1;
            outline: none;
            caret-color: var(--primary-color);
        }

        /* --- グリッチ演出 --- */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(-2px, -1px); }
            60% { transform: translate(2px, 1px); }
            80% { transform: translate(2px, -1px); }
            100% { transform: translate(0); }
        }
        .glitch-text {
            animation: glitch 0.3s infinite;
            display: inline-block;
        }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* スクロールバー */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); }
    </style>
<!-- PORTAL_KIT v4.5 -->

<body>

    <div class="scanlines"></div>
    <div class="crt-overlay"></div>
    <canvas id="bg-canvas"></canvas>
    <canvas id="kero-fx"></canvas>
    <template id="tpl-serpent">
           /^\/^\

 \____|__________/  \

    <div class="terminal-container" onclick="document.getElementById('cmd-input').focus()">
        <div class="terminal-header">
            <span><i class="fas fa-microchip"></i> KERO_OS Kernel v4.4.2</span>
            <span id="lock-status" class="status-badge">LOCKED</span>
        </div>
        
        <div class="terminal-body" id="terminal-output">
            <!-- 起動ログ -->
        </div>
        
        <div style="padding: 0 20px 20px 20px;">
            <div class="input-line">
                <span class="prompt-text">guest@swamp:~$</span>
                <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>

    <script>
        // --- 設定・状態 ---
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('cmd-input');
        const lockStatus = document.getElementById('lock-status');
        const container = document.querySelector('.terminal-container');
        
        let state = {
            isLocked: true,
            snakeMode: false
        };
        
        /* background rain is driven by the Rain engine below */

        // 起動シークエンス
        const bootLogs = [
            "Initializing KERO_OS...",
            "Loading memory modules... [OK]",
            "Mounting /dev/swamp... [OK]",
            "Checking security clearance...",
            "<span class='error'>[ERROR] Biometric verification failed.</span>",
            "<span class='warning'>[WARNING] Guest access restricted. File system encrypted.</span>",
            "<span class='system'>Hint: The password is hidden in the 'noise' of the Developer Tools Console.</span>",
            "Type 'help' for available commands."
        ];

        // --- 謎解き用データ ---
        // 開発者ツール(F12)に出すヒント (Phase 1)
        const CONSOLE_HINT = `
        %c 🐸 RIBBIT RIBBIT 🐸
        %c ---------------------------------------------------
        %c [SYSTEM LOG] Corrupted Key Segment Found:
        %c "0x46 0x52 0x4f 0x47"
        %c ---------------------------------------------------
        %c (Hex to ASCII...?)
        `;

        // --- コマンド処理システム ---
        const commands = {
            'help': () => {
                let cmds = "<span class='kero-badged' style='color:var(--primary-color)'>MAN</span><br>" +
                    "&nbsp; help &nbsp;&nbsp;- Show this list<br>" +
                    "&nbsp; ls &nbsp;&nbsp;&nbsp;&nbsp;- List directory contents<br>" +
                    "&nbsp; clear &nbsp;- Clear terminal<br>" +
                    "&nbsp; exit &nbsp;&nbsp;- Return to Portal";
                if (state.isLocked) {
                    cmds += "<br>&nbsp; unlock - Unlock file system (Requires Password)";
                } else {
                    cmds += "<br>&nbsp; cat &nbsp;&nbsp;&nbsp;- Read file (Usage: cat [filename])" +
                            "<br>&nbsp; <span class='hidden-clue'>invoke</span> - <span class='system'>the manual does not carry this word</span>";
                }
                if (state.snakeMode) {
                    cmds += "<br><br><span class='snake-msg'>&nbsp; abyss &nbsp;&nbsp;&nbsp;- 深淵へ降下する（引き返し不可）</span>" +
                            "<br><span class='snake-msg'>&nbsp; devour &nbsp;&nbsp;&nbsp;- 実行可能オブジェクトを呑む</span>" +
                            "<br><span class='snake-msg'>&nbsp; shed &nbsp;&nbsp;&nbsp;&nbsp;- 皮を脱ぐ</span>" +
                            "<br><span class='snake-msg'>&nbsp; taunt &nbsp;&nbsp;&nbsp;&nbsp;- 蛇を苛つかせる</span>";
                }
                return cmds;
            },
            'ls': () => {
                if (state.isLocked) {
                    return "<span class='encrypted'><i class='fas fa-lock'></i> profile.dat [ENCRYPTED]</span><br>" +
                           "<span class='encrypted'><i class='fas fa-lock'></i> message.txt [ENCRYPTED]</span><br>" +
                           "<span class='encrypted'><i class='fas fa-lock'></i> secret_project.bin [ENCRYPTED]</span><br>" +
                           "<span class='system'>* Access Denied. Use 'unlock' to decrypt.</span>";
                } else {
                    return "<span class='success'>profile.dat</span><br>" +
                           "<span class='success'>message.txt</span><br>" +
                           "<span class='success'>secret_project.bin</span>";
                }
            },
            'clear': () => {
                SFX.whoosh(.6);
                if (output.animate) {
                    const a = output.animate([
                        { transform: 'none', opacity: 1, filter: 'none' },
                        { transform: 'translateY(-6px) skewX(3deg)', opacity: .35, filter: 'blur(3px) brightness(2)', offset: .35 },
                        { transform: 'translateY(-100%) skewX(-8deg)', opacity: 0, filter: 'blur(8px)' }
                    ], { duration: 380, easing: 'cubic-bezier(.7,0,.84,0)' });
                    a.onfinish = () => { output.innerHTML = ''; output.style.opacity = ''; output.style.transform = ''; };
                } else output.innerHTML = '';
                return "";
            },
            'unlock': (args) => {
                if (!state.isLocked) return "System is already unlocked.";
                if (!args[0]) return "Usage: unlock [password]";
                
                const pass = args[0].toUpperCase();
                // Phase 1 答え: FROG
                if (pass === 'FROG' || pass === 'KAERU' || pass === 'AM3I') {
                    state.isLocked = false;
                    unlockFeedback();
                    KP.scramble(lockStatus, "UNLOCKED", { dur: 460 });
                    lockStatus.style.background = "#00ffaa";
                    KP.scramble(document.querySelector('.prompt-text'), "admin@swamp:~$", { dur: 620 });
                    document.querySelector('.prompt-text').textContent = "admin@swamp:~$";
                    document.querySelector('.prompt-text').style.color = "#00ffaa";
                    if (container.animate) container.animate([
                        { boxShadow: "0 0 0 rgba(0,255,170,0)" },
                        { boxShadow: "0 0 90px rgba(0,255,170,.55), inset 0 0 60px rgba(0,255,170,.18)" },
                        { boxShadow: "0 0 20px rgba(255, 0, 85, .2)" }
                    ], { duration: 1100, easing: "cubic-bezier(.16,1,.3,1)" });
                    
                    // Phase 2へのヒント
                    setTimeout(() => {
                        printLine("<br><span class='warning'>[SYSTEM NOTICE] Converter Modules Loaded:</span>");
                        printLine("<span class='system'> - Binary (0101...) -> ASCII text</span>");
                        printLine("<span class='system'> - Hex (0x4A...) -> ASCII text</span>");
                        printLine("<span class='system'> - Pattern Recognition (Read carefully)</span>");
                        printLine("<span class='highlight'>Combine fragments from ALL files to proceed deeper.</span>");
                    }, 1000);

                    return "<span class='success'>Access Granted. Decryption Complete.</span><br>Welcome back, Amphibian Commander.";
                } else {
                    denyFeedback();
                    KP.fx.bars({ rgb: [255, 40, 60], until: 340, dur: 340, max: 6 });
                    return "<span class='error'>[ACCESS DENIED] Incorrect Password.</span> <span class='system'>試行は記録された。蛙は笑っている。</span>";
                }
            },
            'cat': (args) => {
                if (state.isLocked) return "<span class='error'>[ERROR] File system is encrypted. Unlock first.</span>";
                if (!args[0]) return "Usage: cat [filename]";

                const file = args[0].toLowerCase();
                
                // --- 激ムズ謎解きパート ---
                // 答え: invoke SERPENT
                // 1. invoke (message.txt: 頭文字)
                // 2. SER (profile.dat: Binary)
                // 3. PENT (secret_project.bin: Hex)

                if (file === 'profile.dat' || file === 'profile') {
                    return `
<div style="border:1px solid #00ffaa; padding:10px; color:#00ffaa;">
[USER PROFILE]<br>
ID: Am3i<br>
CLASS: Amphibia<br>
<span class="system"># GENOME SEQUENCE (SEGMENT A):</span><br>
<span class="binary-highlight">01010011 01000101 01010010</span><br>
<br>
HABITAT: Localhost<br>
LIKES: Clean Code, Rain<br>
NOTE: The genome is incomplete. Seek the tail in the binary.<br>
</div>`;
                } else if (file === 'message.txt' || file === 'message') {
                    return `
<div class="frog-msg">
ゲロゲロ...<br>
<br>
<strong>i</strong>nitiate 接続ヲ開始セヨ...<br>
<strong>n</strong>eural 神経回路ヲ繋ゲ...<br>
<strong>v</strong>oice 声ナキ声ヲ聴ケ...<br>
<strong>o</strong>f 深淵ノ...<br>
<strong>k</strong>ernel 核トナル...<br>
<strong>e</strong>ngine 原動力ヲ...<br>
<br>
縦ニ読ミ解キ、ソノ言葉ヲ命令(Command)トセヨ。<br>
<span class="system">(Read the first letters of the bold words)</span>
</div>`;
                } else if (file === 'secret_project.bin' || file.includes('secret')) {
                    return `
<span class="system">Dump of 0x08004000:</span><br>
<pre style="font-size:10px; line-height:12px; color:#aaa;">
00000000: 4B 45 52 4F 5F 4F 53 00  |.KERO_OS.|
00000010: 53 59 53 54 45 4D 5F 48  |.SYSTEM_H|
00000020: 41 4C 54 2E 2E 2E 2E 2E  |ALT.....|
00000030: <span class="hex-highlight">50 45 4E 54</span> 00 00 00 00  |.<span class="hex-highlight">????</span>....|
00000040: 00 00 00 00 00 00 00 00  |........|
</pre>
<span class="system">WARNING: Memory segment 0x30 corrupted. Manual Hex-to-ASCII conversion required for the tail.</span>
`;
                } else {
                    return `<span class='error'>File not found: ${file}</span>`;
                }
            },
            // --- 隠しコマンド: invoke [SERPENT] ---
            'invoke': (args) => {
                if (!args[0]) return "<span class='warning'>Usage: invoke [TARGET_ENTITY]</span><br><span class='system'>Target entity name required. Combine the keys from the files.</span>";
                const target = args[0].toUpperCase();
                if (target === 'SERPENT' || target === 'SNAKE' || target === 'OROCHI' || target === 'SERPENT;') {
                    printLine("<span class='snake-msg' style='font-size:1.35rem;letter-spacing:.1em'>SYSTEM BREACH DETECTED</span> <span class='system'>// 呼んだのは君だ。</span>");
                    serpentBreach();
                    return "";
                }
                denyFeedback();
                return `<span class='error'>Connection failed: Entity '${target}' not found in the void.</span>`;
            },
            /* --- 深淵 --- */
            'abyss': (args) => {

            'dive': (a) => commands['abyss'](a),

        /* ============================================================
           CINEMATIC DIRECTOR — secret.html
           Two authored sequences on top of the shared PX engine:
             · serpentBreach()  — invoke SERPENT   (hostile takeover)
             · abyssDive()      — ENTER THE ABYSS  (cross-page dive)
           Both degrade to a plain, instant state change if the engine
           is unavailable, and never block navigation.
           ============================================================ */
        const promptEl = document.querySelector('.prompt-text');
        const KERO = {
            px: window.PX || null,
            busy: false,
            serpent: null,
            GL: 'ｦｧｨｩｪｫｬｭｮｯｱｲｳ01#%&*+=<>/|ﾊﾋﾌﾍﾎ',
            VIOLET: [191, 0, 255],
            ABYSS:  [0, 255, 162]
        };
        const kwait = ms => new Promise(r => setTimeout(r, ms));
        const kpick = a => a[(Math.random() * a.length) | 0];

        /* no-op shim so the choreography below needs no `if(px)` everywhere */
        const KP = KERO.px || {
            filter: { tween: () => Promise.resolve(), set() {}, reset() {} },
            camera: { tween: () => Promise.resolve(), shake: () => Promise.resolve(), set() {}, reset() {} },
            iris:   { to: () => Promise.resolve(), set() {}, off() {} },
            fx:     { bars: () => ({}), debris: () => ({}), rings: () => ({}), starfield: () => ({}), onFrame: () => ({ kill() {} }) },
            sfx:    new Proxy({}, { get: () => () => {} }),
            flash:  () => Promise.resolve(), bloom: () => Promise.resolve(),
            caption: () => ({ kill() {}, setText() {} }), rail: () => ({ set() {}, kill() {} }),
            shatter: () => ({ done: Promise.resolve(), restore() {} }),
            assemble: () => Promise.resolve(),
            glitch:  () => Promise.resolve(), scramble: () => Promise.resolve(),
            veil:   { on() {}, off: () => Promise.resolve(), in: () => Promise.resolve() },
            handoff: null
        };
        const SFX = KP.sfx;

        /* ---------- the serpent, drawn (not pasted) ---------- */
        const Serpent = (function () {
            let cv = null, ctx = null, rafId = 0, running = false, t0 = 0, last = 0, S = null, dpr = 1;

            function ensure() {
                if (cv) return true;
                cv = document.getElementById('kero-fx');
                if (!cv) return false;
                ctx = cv.getContext('2d');
                if (!ctx) return false;
                addEventListener('resize', size, { passive: true });
                size();
                return true;
            }
            function size() {
                if (!cv) return;
                dpr = Math.min(devicePixelRatio || 1, 1.6);
                cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
                cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            function ribbon(pts, radFn, fill, edge, lw) {
                const L = [], R = [];
                for (let i = 0; i < pts.length; i++) {
                    const p = pts[i], q = pts[Math.max(0, i - 1)], r = pts[Math.min(pts.length - 1, i + 1)];
                    const dx = r.x - q.x, dy = r.y - q.y, len = Math.hypot(dx, dy) || 1;
                    const nx = -dy / len, ny = dx / len, w = radFn(i / (pts.length - 1), p);
                    L.push({ x: p.x + nx * w, y: p.y + ny * w });
                    R.push({ x: p.x - nx * w, y: p.y - ny * w });
                }
                ctx.beginPath(); ctx.moveTo(L[0].x, L[0].y);
                for (let j = 1; j < L.length; j++) ctx.lineTo(L[j].x, L[j].y);
                for (let k = R.length - 1; k >= 0; k--) ctx.lineTo(R[k].x, R[k].y);
                ctx.closePath();
                if (fill) { ctx.fillStyle = fill; ctx.fill(); }
                if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = lw || 1.1; ctx.stroke(); }
                return { L, R };
            }
            function coilPoints(t, prog, dir, phase) {
                const W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2, pts = [], N = 150;
                for (let i = 0; i <= N; i++) {
                    const u = i / N;
                    const a = u * Math.PI * 2 * 1.55 + t * (0.5 + prog * 1.3) * dir + phase;
                    const base = 1 - prog * 0.44;
                    const rx = W * 0.68 * base * (0.5 + 0.5 * Math.abs(Math.cos(a * 0.5 + 0.4)));
                    const ry = H * 0.74 * base * (0.5 + 0.5 * Math.abs(Math.sin(a * 0.5 - 0.2)));
                    const wob = 1 + 0.055 * Math.sin(a * 3 + t * 2.4) + 0.03 * Math.sin(a * 7 - t * 1.3);
                    pts.push({ x: cx + Math.cos(a) * rx * wob, y: cy + Math.sin(a) * ry * wob, u });
                }
                return pts;
            }
            function eye(x, y, s, open, look) {
                ctx.save(); ctx.translate(x, y);
                ctx.beginPath(); ctx.ellipse(0, 0, s * 1.25, s * (0.9 * open), 0, 0, Math.PI * 2);
                const g = ctx.createRadialGradient(-s * .3, -s * .3, s * .1, 0, 0, s * 1.4);
                g.addColorStop(0, '#fff2b0'); g.addColorStop(.45, '#ff9d00'); g.addColorStop(1, '#5a1000');
                ctx.fillStyle = g; ctx.fill();
                ctx.shadowColor = 'rgba(255,140,0,.9)'; ctx.shadowBlur = s * 2.4;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.ellipse(look * s * .28, 0, s * .26, s * (0.86 * open), 0, 0, Math.PI * 2);
                ctx.fillStyle = '#08000c'; ctx.fill();
                ctx.restore();
            }
            function draw(now) {
                if (!running) return;
                const dt = Math.min((now - last) / 1000, .05); last = now;
                const t = (now - t0) / 1000, W = innerWidth, H = innerHeight;
                S.t += dt;
                ctx.clearRect(0, 0, W, H);
                if (S.mode === 'idle') { drawIdle(t); rafId = requestAnimationFrame(draw); return; }

                const prog = S.prog, sq = S.squeeze;
                for (let c = 0; c < 2; c++) {
                    const dir = c ? -1 : 1;
                    const pts = coilPoints(S.t, prog, dir, c * 2.1);
                    const thick = (10 + 34 * prog) * (1 + sq * .3);
                    const alpha = .34 + .5 * prog;
                    const rad = (u) => thick * Math.pow(Math.sin(Math.min(1, u * .98) * Math.PI), .55) * (1 + .18 * Math.sin(u * 22 + S.t * 3));
                    /* silhouette */
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.shadowColor = 'rgba(160,0,255,.85)'; ctx.shadowBlur = 26 * (0.4 + prog);
                    ribbon(pts, rad, 'rgba(26,0,40,.92)', 'rgba(191,0,255,.55)', 1.2);
                    ctx.restore();
                    /* belly banding = readable scales */
                    const e = ribbon(pts, rad, null, null);
                    ctx.save(); ctx.globalAlpha = (.22 + .4 * prog);
                    for (let i = 2; i < e.L.length - 1; i += 3) {
                        ctx.beginPath();
                        ctx.moveTo(e.L[i].x, e.L[i].y); ctx.lineTo(e.R[i].x, e.R[i].y);
                        ctx.lineTo(e.R[i + 1].x, e.R[i + 1].y); ctx.lineTo(e.L[i + 1].x, e.L[i + 1].y);
                        ctx.closePath();
                        ctx.fillStyle = (i % 6 === 2) ? 'rgba(255,120,255,.5)' : 'rgba(70,0,110,.55)';
                        ctx.fill();
                    }
                    ctx.restore();
                    /* specular crest */
                    ctx.save(); ctx.globalAlpha = .5 * (0.35 + prog);
                    ctx.strokeStyle = 'rgba(255,220,255,.75)'; ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    for (let i = 0; i < pts.length; i++) {
                        const nx = (e.L[i].x - e.R[i].x) * .26, ny = (e.L[i].y - e.R[i].y) * .26;
                        const X = pts[i].x + nx, Y = pts[i].y + ny;
                        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
                    }
                    ctx.stroke(); ctx.restore();
                    /* head */
                    const hp = pts[pts.length - 1], np = pts[pts.length - 3];
                    const ang = Math.atan2(hp.y - np.y, hp.x - np.x);
                    const hs = thick * (1.7 + prog * 1.1);
                    ctx.save(); ctx.translate(hp.x, hp.y); ctx.rotate(ang);
                    ctx.shadowColor = 'rgba(190,0,255,.9)'; ctx.shadowBlur = 30 * prog;
                    ctx.beginPath(); ctx.ellipse(0, 0, hs * 1.5, hs * .92, 0, 0, Math.PI * 2);
                    const hg = ctx.createLinearGradient(0, -hs, 0, hs);
                    hg.addColorStop(0, '#40065c'); hg.addColorStop(.5, '#1b0028'); hg.addColorStop(1, '#0b0012');
                    ctx.fillStyle = hg; ctx.fill();
                    ctx.strokeStyle = 'rgba(215,120,255,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
                    ctx.shadowBlur = 0;
                    const bl = (Math.sin(S.t * 1.7 + c * 2) > .965) ? .12 : 1;
                    eye(-hs * .1, -hs * .38, hs * .3, bl, 0);
                    eye(-hs * .1, hs * .38, hs * .3, bl, 0);
                    if (Math.sin(S.t * 2.6 + c) > .93) {         /* tongue flick */
                        ctx.strokeStyle = '#ff2d6f'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(hs * 1.3, 0); ctx.lineTo(hs * 2.3, -hs * .3);
                        ctx.moveTo(hs * 1.3, 0); ctx.lineTo(hs * 2.3, hs * .3); ctx.stroke();
                    }
                    ctx.restore();
                }
                if (S.lunge > 0) {
                    const r = S.lunge * Math.max(W, H) * 1.15;
                    const g = ctx.createRadialGradient(W / 2, H / 2, r * .1, W / 2, H / 2, r);
                    g.addColorStop(0, '#000'); g.addColorStop(.72, 'rgba(10,0,18,.96)');
                    g.addColorStop(.9, 'rgba(160,0,255,.5)'); g.addColorStop(1, 'rgba(191,0,255,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.fill();
                }
                S.squeeze *= Math.pow(.02, dt);
                rafId = requestAnimationFrame(draw);
            }
            let blinkT = 0;
            function drawIdle(t) {
                /* two eyes, low-opacity, breathing — the vessel is watched */
                const W = innerWidth, H = innerHeight;
                blinkT -= 1 / 60;
                if (blinkT < -3.4) blinkT = .16;
                const open = blinkT > 0 ? .12 : 1;
                const px2 = (KERO.px ? KERO.px.pointer.x : .5), py2 = (KERO.px ? KERO.px.pointer.y : .5);
                const lx = (px2 - .5) * 2, ly = (py2 - .5) * 2;
                ctx.save(); ctx.globalAlpha = .5;
                for (let i = 0; i < 2; i++) {
                    const x = W * (i ? .615 : .385) + lx * 9, y = H * .135 + ly * 6 + Math.sin(t * .9 + i) * 3;
                    eye(x, y, 9, open, lx);
                }
                ctx.restore();
            }
            return {
                open(o) {
                    if (!ensure()) return;
                    if (S) Object.assign(S, o || {});
                    else S = Object.assign({ prog: 0, squeeze: 0, lunge: 0, t: 0, mode: 'coil' }, o || {});
                    if (running) return;
                    running = true; t0 = last = performance.now(); rafId = requestAnimationFrame(draw);
                },
                close() { running = false; cancelAnimationFrame(rafId); if (ctx) ctx.clearRect(0, 0, innerWidth, innerHeight); },
                set(k, v) { if (S) S[k] = v; }, get state() { return S; }
            };
        })();

        /* ---------- glyph materialiser for the ASCII serpent ---------- */
        function materialize(host) {
            const spans = [].slice.call(host.querySelectorAll('.g'));
            const t0 = performance.now();
            spans.forEach(s => { s._dl = parseFloat(s.style.getPropertyValue('--d')) || 0; s._c = s.textContent; });
            (function loop() {
                const t = performance.now() - t0; let alive = false;
                for (let i = 0; i < spans.length; i++) {
                    const s = spans[i]; if (s._done) continue;
                    const e = t - s._dl;
                    if (e > 230) { s.textContent = s._c; s._done = true; s.classList.add('set'); continue; }
                    alive = true;
                    if (e > 0 && Math.random() < .55) s.textContent = kpick(KERO.GL);
                }
                if (alive) requestAnimationFrame(loop);
            })();
        }
        function buildAscii(container, art) {
            const pre = document.createElement('pre');
            pre.className = 'kero-ascii';
            const lines = art.replace(/\s+$/, '').split('\n');
            lines.forEach((line, li) => {
                for (let i = 0; i < line.length; i++) {
                    const sp = document.createElement('span');
                    sp.className = 'g';
                    sp.textContent = line[i] === ' ' ? '\u00a0' : line[i];
                    sp.style.setProperty('--d', (li * 24 + Math.abs(i - line.length / 2) * 2.4 + Math.random() * 120).toFixed(0) + 'ms');
                    sp.style.setProperty('--dx', (Math.random() * 190 - 95).toFixed(0) + 'px');
                    sp.style.setProperty('--dy', (-30 - Math.random() * 150).toFixed(0) + 'px');
                    sp.style.setProperty('--dr', (Math.random() * 200 - 100).toFixed(0) + 'deg');
                    pre.appendChild(sp);
                }
                pre.appendChild(document.createTextNode('\n'));
            });
            container.appendChild(pre);
            return pre;
        }

        /* ---------- corrupted echo of what the operator just typed ---------- */
        function corruptEcho(el, dur) {
            if (!el) return Promise.resolve();
            const txt = el.textContent || '', t0 = performance.now();
            return new Promise(res => {
                (function loop() {
                    const t = Math.max(0, Math.min(1, (performance.now() - t0) / (dur || 500)));
                    el.textContent = txt.split('').map((ch, i) =>
                        ch === ' ' ? ' ' : (i / txt.length < t * 1.15 ? ch : kpick(KERO.GL))).join('');
                    if (t < 1) requestAnimationFrame(loop); else { el.textContent = txt; res(); }
                })();
            });
        }
        function jitterLog() {
            const lines = [].slice.call(output.querySelectorAll('.line')).slice(-14);
            lines.forEach((l, i) => {
                l.classList.add('kero-shake-line');
                if (l.animate) l.animate([
                    { transform: 'none', filter: 'none' },
                    { transform: 'translateX(' + (Math.random() * 26 - 13).toFixed(1) + 'px) skewX(' + (Math.random() * 6 - 3).toFixed(1) + 'deg)', filter: 'hue-rotate(' + (Math.random() * 120 - 60).toFixed(0) + 'deg)', offset: .3 },
                    { transform: 'translateX(' + (Math.random() * 12 - 6).toFixed(1) + 'px)', offset: .7 },
                    { transform: 'none', filter: 'none' }
                ], { duration: 420 + Math.random() * 420, delay: i * 26, easing: 'steps(3)' });
                setTimeout(() => l.classList.remove('kero-shake-line'), 1400);
            });
        }

        /* ============================================================
           SEQUENCE 01 — invoke SERPENT
        ============================================================ */
        async function serpentBreach() {
            if (KERO.busy) return;
            KERO.busy = true;
            state.snakeMode = true;
            input.disabled = true;
            const term = container;
            document.body.classList.add('kero-breach');
            lockStatus.textContent = 'BREACH';
            lockStatus.style.background = '#bf00ff';
            lockStatus.style.color = '#12000e';
            Rain.boost(2.4);
            Rain.setMode('alert+');

            try {
                /* — 1 · DECOHERENCE ——————————————————————————— */
                SFX.snake(); SFX.hiss(1.2);
                KP.caption('ENTITY 0x53E9', 'SERPENT // HANDSHAKE FORCED', { rgb: KERO.VIOLET });
                KP.filter.tween({ chroma: [0, 10], warp: [0, 7], bright: [0, .2] }, 320, 'oC');

                await kwait(420);
                SFX.riser(1.15);
                KP.filter.tween({ warp: [7, 22], tear: [0, 14], chroma: [10, 28], bright: [.2, .5], sat: [0, 1.2] }, 1050, 'iQu');
                KP.camera.tween({ scale: 1.075 }, 1150, 'ioQu5');

                KP.fx.bars({ rgb: KERO.VIOLET, until: 1400, dur: 1400, max: 9, thick: 30 });
                KP.fx.debris({ rgb: KERO.VIOLET, count: 190, pull: 1400, swirl: 900, dur: 2.6 });
                printLine("<span class='kero-badged' style='color:#bf00ff'>PERMISSION 775 → 777</span> <span class='system'>…権限を書き換えている。止められない。</span>");
                await kwait(760);

                /* — 2 · CONSTRICTION ————————————————————————— */
                const rail = KP.rail('CONSTRICTION', { rgb: KERO.VIOLET });
                document.body.classList.add('kero-clamping');
                Serpent.open({ prog: 0 });
                Rain.setMode('serpent');
                const DUR = 1750, st = performance.now();

                    (function loop() {

                            SFX.impact(1);

                            if (term.animate) term.animate([{ filter: 'brightness(2.4) contrast(1.6)' }, { filter: 'none' }], { duration: 260, easing: 'steps(2)' });
                            Rain.boost(2.8);

                        if (p < 1) requestAnimationFrame(loop); else res();
                    })();
                });

                document.body.classList.remove('kero-clamping');
                KP.caption('THE VESSEL IS REPLACED', 'KERO_OS // SUPERSEDED', { rgb: KERO.VIOLET });

                /* — 3 · DEVOUR ——————————————————————————————— */
                SFX.scream();
                Serpent.open({ mode: 'coil', prog: 1, lunge: 0 });
                KP.fx.debris({ rgb: KERO.VIOLET, count: 240, pull: 3600, swirl: 1600, dur: 1.0 });
                KP.camera.tween({ scale: 1.42, rot: 3.5 }, 620, 'iQu');
                KP.filter.tween({ warp: [22, 44], tear: [14, 34], chroma: [28, 52], invert: [0, .55], blur: [0, 3] }, 560, 'iQu');
                const sh = KP.shatter(term, { rgb: KERO.VIOLET, slices: 20, dur: 900, spread: 1.5, fall: .5, spin: 2, hide: [term] });
                await kwait(300);
                const lungeStart = performance.now();
                await new Promise(res => {
                    (function loop() {

                KP.filter.reset(); KP.camera.reset();
                await kwait(220);

                /* — 4 · AWAKEN ——————————————————————————————— */
                document.body.classList.remove('kero-breach');
                document.body.classList.add('kero-serpent', 'snake-mode');
                Rain.setMode('serpent');
                promptEl.textContent = 'serpent@abyss:~$';
                promptEl.style.color = '#00ff00';
                KP.veil.off(140);
                await Promise.all([
                    KP.iris.to({ from: 0, to: 1.6, dur: 780, edge: .17, rgb: KERO.VIOLET }),
                    KP.assemble(term, { rgb: KERO.VIOLET, slices: 14, dur: 700, stagger: 14 })
                ]);
                KP.iris.off();
                const banner = document.createElement('div');
                banner.className = 'line';
                banner.innerHTML = "<span class='snake-msg' style='font-size:1.02rem;letter-spacing:.16em'>WELCOME TO THE SNAKE DEN.<br>The Frog was merely a vessel.</span>";
                output.appendChild(banner);
                const pre = buildAscii(output, serpentArt());
                materialize(pre);
                output.scrollTop = output.scrollHeight;
                SFX.portal(); SFX.chime(true);
                Serpent.set('lunge', 0);
                await kwait(60);
                /* the invitation */
                const wrap = document.createElement('div');
                wrap.className = 'line';
                wrap.innerHTML = "<a class='kero-dive-link' href='abyss.html' id='abyss-link' data-px-skip><i>◉</i> ENTER THE ABYSS</a>" +
                    "<div class='system' style='margin-top:.45rem;font-size:.8rem'>archive 04 // 蛇の腹の中で、蛙はStill Running している。</div>";
                output.appendChild(wrap);
                wrap.querySelector('a').addEventListener('click', e => { e.preventDefault(); abyssDive(); });
                output.scrollTop = output.scrollHeight;
                await kwait(900);
                Serpent.open({ mode: 'idle' });
                if (window.PK && PK.toast) PK.toast('ANCIENT ONE AWAKENS', '蛇が ROOT を乗っ取った。入力は受け付けられる。', true);
                printLine("<span class='system'>new commands: <span class='snake-msg'>abyss</span> · devour · shed · taunt</span>");
            } catch (err) {
                try { console.warn('[KERO] breach degraded —', err && err.message, err); } catch (e) { }
                document.body.classList.add('snake-mode', 'kero-serpent');
                Serpent.close();
                try { KP.iris.off(); KP.veil.off(120); term.style.visibility = ''; } catch (e) { }
            } finally {
                KP.filter.reset(); KP.camera.reset();
                input.disabled = false; input.focus();
                KERO.busy = false;
            }
        }
        function serpentArt() {
            const t = document.getElementById('tpl-serpent');
            if (!t) return '';
            // strip the wrapper's own newlines, never the art's indentation
            return (t.innerHTML || '').replace(/^[\s\u00a0]*\n/, '').replace(/\s+$/, '');
        }

        /* ============================================================
           SEQUENCE 02 — enter the abyss (cross-page dive)
        ============================================================ */
        async function abyssDive() {
            if (KERO.busy) return;
            KERO.busy = true;
            input.disabled = true;
            Serpent.close();
            if (KERO.px) { try { KERO.px.veil.on(); } catch (e) { } }
            document.body.classList.add('kero-dive');
            Rain.setMode('dive');
            printLine("<span class='kero-badged' style='color:#00ffa2'>DIVE AUTHORIZED</span> <span class='system'>pressure hold · no return ticket</span>");
            SFX.boot(); SFX.hiss(.9);
            const rgb = KERO.ABYSS;
            let rail = KP.rail('DESCENT', { rgb });
            const t0 = performance.now(), TOTAL = 2500;
            (function up() {
                const p = Math.min(1, (performance.now() - t0) / TOTAL);
                rail.set(p, p > .82 ? 'HOLD' : '');
                if (p < 1) setTimeout(up, 40);
            })();
            KP.caption('PRESSURE HOLD', 'DESCENT TO ARCHIVE_CORE', { rgb });
            SFX.riser(1.5);
            KP.filter.tween({ warp: [0, 12], chroma: [0, 16], sat: [0, .7], bright: [0, .18] }, 1000, 'oC');
            KP.camera.tween({ scale: 1.16, rot: -1.6 }, 1700, 'ioQu5');
            await kwait(680);
            SFX.crack();
            KP.glitch(container, { dur: 420, slices: 7, rgb });
            const sh = KP.shatter(container, { rgb, slices: 18, dur: 1500, spread: 1.15, fall: .8, spin: 1.7, hide: [container] });
            KP.fx.debris({ rgb, count: 230, pull: 2900, swirl: 1500, dur: 2.2 });
            KP.fx.rings({ rgb, r0: 20, r1: Math.max(innerWidth, innerHeight), dur: 1.6, count: 4, chroma: true });
            Rain.boost(4.5);
            SFX.stutter(20, 900);
            await kwait(700);
            KP.caption('EVENT HORIZON', 'LIGHT IS NOT COMING BACK', { rgb });
            SFX.sweep(1.0, false);
            KP.filter.tween({ warp: [12, 30], tear: [0, 18], chroma: [16, 40], blur: [0, 2.5], bright: [.18, -.25] }, 800, 'iQu');
            await KP.iris.to({ from: 1.5, to: 0, dur: 1100, edge: .05, rgb, tint: '#000409' });
            KP.veil.on();
            try { sh.restore(); } catch (e) { }
            document.documentElement.classList.add('kero-black');
            KP.camera.reset();
            SFX.heartbeat(2, .34);
            Rain.setMode('void');
            await kwait(340);
            if (KP.handoff) { try { KP.handoff.write('dive', { rgb, x: .5, y: .5 }); } catch (e) { } }
            location.href = 'abyss.html';
        }

        /* ---------- small feedbacks for the ordinary commands ---------- */
        function denyFeedback(msg) {
            SFX.deny();
            KP.filter.tween({ chroma: [0, 16], tear: [0, 10] }, 140, 'iC').then(() => KP.filter.tween({ chroma: [16, 0], tear: [10, 0] }, 260, 'oC'));
            KP.camera.shake({ amp: 9, dur: 260, decay: 6 });
            if (container.animate) container.animate([{ borderColor: '#ff3333' }, { borderColor: '' }], { duration: 420, easing: 'steps(3)' });
            KP.fx.bars({ rgb: [255, 40, 60], until: 260, dur: 260, max: 5 });
        }
        function unlockFeedback() {
            SFX.chime(true);
            KP.filter.tween({ bright: [0, .55], chroma: [0, 12] }, 220, 'oC').then(() => KP.filter.tween({ bright: [.55, 0], chroma: [12, 0] }, 420, 'oQu5'));
            KP.bloom({ rgb: [0, 255, 170], dur: 900, peak: .55 });
            KP.fx.rings({ rgb: [0, 255, 170], r0: 10, r1: Math.max(innerWidth, innerHeight) * .8, dur: 1.1, count: 3, chroma: true });
            KP.flash({ rgb: [0, 255, 170], peak: .28, dur: 320, silent: true });
        }

        // --- 処理実行 ---
        function printLine(text, isHTML = true) {
            const div = document.createElement('div');
            div.className = 'line';
            if (isHTML) div.innerHTML = text;
            else div.textContent = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        async function init() {
            // コンソールヒント出力
            console.log(CONSOLE_HINT, 
                "color: #00ffaa; font-size: 20px; font-weight: bold;", 
                "color: #888;", 
                "color: #ff3333;", 
                "color: #fff; background: #330000; padding: 5px;",
                "color: #888;", 
                "color: #aaa; font-style: italic;"
            );

            // ブートログ表示 — 1行ずつ「打ち込まれ」て、サチりと共に着地する
            for (let line of bootLogs) {
                const el = document.createElement('div');
                el.className = 'line';
                output.appendChild(el);
                const plain = line.replace(/<[^>]+>/g, '');
                let isHtml = /<[^>]+>/.test(line);
                if (isHtml) { el.innerHTML = line; }
                else {
                    let i = 0;
                    await new Promise(res => {
                        (function ty() {
                            el.textContent = plain.slice(0, ++i);
                            if (i % 3 === 0) SFX.tick();
                            output.scrollTop = output.scrollHeight;
                            if (i < plain.length) setTimeout(ty, 9 + Math.random() * 12);
                            else res();
                        })();
                    });
                }
                if (el.animate) el.animate([{ opacity: 0, transform: 'translateX(-14px)', filter: 'blur(4px)' },
                                            { opacity: 1, transform: 'none', filter: 'none' }],
                    { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
                await new Promise(r => setTimeout(r, 120 + Math.random() * 220));
                output.scrollTop = output.scrollHeight;
            }
            if (window.PK && PK.toast) PK.toast('ROOT ACCESS', '端末は起動した。あとは解読するだけだ。');
        }

        // コマンド入力イベント
        const KERO_HIST = []; let kHistI = -1;
        input.addEventListener('keydown', (e) => {
            /* ↑/↓ 履歴、Tab 補完 */
            if (e.key === 'ArrowUp' && !state._editing) {
                const c = ['help','ls','clear','exit'].concat(state.isLocked ? ['unlock'] : ['cat']).concat(state.snakeMode ? ['abyss','devour','taunt'] : []);
                if (kHistI < 0 && KERO_HIST.length === 0) { kHistI = c.length; }
                const src = KERO_HIST.length ? KERO_HIST : c;
                kHistI = Math.max(0, kHistI - 1);
                input.value = src[kHistI] || '';
                e.preventDefault(); return;
            }
            if (e.key === 'ArrowDown') {
                const src = KERO_HIST.length ? KERO_HIST : [];
                kHistI = Math.min(src.length, kHistI + 1);
                input.value = src[kHistI] || '';
                e.preventDefault(); return;
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                const all = ['help','ls','cat','clear','unlock','invoke','abyss','devour','shed','taunt','exit'];
                const v = input.value.trim().toLowerCase();
                if (v) {
                    const hit = all.filter(k => k.indexOf(v) === 0);
                    if (hit.length === 1) { input.value = hit[0] + ' '; SFX.tick(); }
                    else if (hit.length > 1) printLine("<span class='system'>" + hit.join('  ') + "</span>");
                }
                return;
            }
            if (e.key === 'Enter') {
                const val = input.value.trim();
                if (!val) return;
                
                // ユーザー入力を表示
                let prompt = state.isLocked ? "guest@swamp:~$" : "admin@swamp:~$";
                if(state.snakeMode) prompt = "serpent@abyss:~$";

                let promptColor = state.isLocked ? "var(--primary-color)" : "#00ffaa";
                if(state.snakeMode) promptColor = "#00ff00";
                
                const userLine = `<span style="color:${promptColor}; margin-right:10px;">${prompt}</span>${val}`;
                printLine(userLine);
                
                // コマンド解析
                KERO_HIST.push(val); kHistI = -1;
                const args = val.split(/\s+/);
                const cmd = args.shift().toLowerCase();
                
                let response = "";
                if (commands[cmd]) {
                    response = commands[cmd](args);
                } else {
                    denyFeedback();
                    response = `<span class='error'>Command not found: ${cmd}. Type 'help' for assistance.</span>`;
                }
                
                if (response) printLine(response);
                
                input.value = "";
            }
        });

        // 常にフォーカス
        document.addEventListener('click', () => {
            if(!input.disabled) input.focus();
        });

        // スタート
        init();

        /* ============================================================
           BACKGROUND ENGINE — "digital rain", rebuilt
           head-bright columns, flicker, additive trails, and a
           vortex pull that ramps up during the dive.
           modes: alert / alert+ / serpent / dive / void
           ============================================================ */
        const Rain = (function () {
            const rcv = document.getElementById('bg-canvas');
            const rx = rcv ? rcv.getContext('2d') : null;
            const GLY = '01SNAKEｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷ#$%&*+=<>';
            const PAL = {
                'alert': { base: [255, 0, 85], head: [255, 225, 235], wash: .055, op: .5, pull: .02, sp: 1 },
                'alert+': { base: [255, 60, 140], head: [255, 245, 250], wash: .11, op: .85, pull: .5, sp: 2.1 },
                'serpent': { base: [172, 0, 255], head: [230, 190, 255], wash: .05, op: .62, pull: .05, sp: 1.15 },
                'dive': { base: [0, 255, 170], head: [240, 255, 250], wash: .16, op: 1, pull: 2.4, sp: 3.2 },
                'void': { base: [30, 30, 44], head: [70, 70, 96], wash: .34, op: 1, pull: 3.4, sp: 4.4 }
            };
            let W = 0, H = 0, DPR = 1, cols = [], FS = 15, mode = 'alert', energy = 1, raf = 0, last = 0, dirty = false;

            function size() {
                if (!rx) return;
                DPR = Math.min(devicePixelRatio || 1, 1.5);
                W = innerWidth; H = innerHeight;
                rcv.width = Math.floor(W * DPR); rcv.height = Math.floor(H * DPR);
                rcv.style.width = W + 'px'; rcv.style.height = H + 'px';
                rx.setTransform(DPR, 0, 0, DPR, 0, 0);
                rx.fillStyle = '#050000'; rx.fillRect(0, 0, W, H);
                build();
            }
            function build() {
                const n = Math.ceil(W / FS) + 1;
                cols = [];
                for (let i = 0; i < n; i++) {
                    cols.push({
                        x: i * FS + FS * .5, y: Math.random() * -H * .9,
                        sp: 80 + Math.random() * 230, hot: Math.random() < .07, ph: Math.random() * 7, tail: 0
                    });
                }
            }
            function frame(now) {
                raf = requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, .05); last = now;
                if (!rx || document.hidden) return;
                const p = PAL[mode] || PAL.alert;
                energy += (1 - energy) * Math.min(1, dt * 1.25);
                const cx = W * .5, cy = H * .5;
                rx.globalCompositeOperation = 'source-over';
                rx.fillStyle = 'rgba(3,0,7,' + (p.wash * Math.min(2.2, .7 + energy * .8)).toFixed(3) + ')';
                rx.fillRect(0, 0, W, H);
                rx.globalCompositeOperation = 'lighter';
                rx.font = FS + 'px "Share Tech Mono", monospace';
                rx.textAlign = 'center';
                for (let i = 0; i < cols.length; i++) {
                    const c = cols[i];
                    c.y += c.sp * dt * p.sp * energy;
                    c.ph += dt * 8;
                    if (p.pull) {
                        c.x += (cx - c.x) * p.pull * dt * energy;
                        c.y += (cy - c.y) * p.pull * dt * .22 * energy;
                    }
                    if (c.y > H + 60) { c.y = -Math.random() * 140; c.sp = 80 + Math.random() * 230; c.hot = Math.random() < .07; }
                    const a = .38 + .5 * Math.abs(Math.sin(c.ph));
                    rx.fillStyle = 'rgba(' + p.base.join(',') + ',' + (a * (c.hot ? 1 : .7)).toFixed(3) + ')';
                    rx.fillText(GLY[(Math.random() * GLY.length) | 0], c.x, c.y);
                    if (c.hot) {
                        rx.fillStyle = 'rgba(' + p.head.join(',') + ',.9)';
                        rx.fillText(GLY[(Math.random() * GLY.length) | 0], c.x, c.y - FS);
                        rx.fillStyle = 'rgba(' + p.base.join(',') + ',.42)';
                        rx.fillText(GLY[(Math.random() * GLY.length) | 0], c.x, c.y - FS * 2);
                    }
                }
                /* horizon band — a soft sweep that makes the field feel lit */
                const by = (now / 1000 * 90 * (1 + energy)) % (H + 240) - 120;
                const g = rx.createLinearGradient(0, by - 90, 0, by + 90);
                g.addColorStop(0, 'rgba(0,0,0,0)');
                g.addColorStop(.5, 'rgba(' + p.base.join(',') + ',' + (.05 * (1 + energy)).toFixed(3) + ')');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                rx.fillStyle = g; rx.fillRect(0, by - 90, W, 180);
            }
            function applyLook() {
                if (!rcv) return;
                const p = PAL[mode] || PAL.alert;
                if (rcv) rcv.style.opacity = p.op;
                rcv.style.filter = 'saturate(' + (1 + energy * .6).toFixed(2) + ') blur(' + (mode === 'dive' || mode === 'void' ? .4 : 0) + 'px)';
            }
            if (rx) {
                const RM = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
                addEventListener('resize', () => { if (dirty) return; dirty = true; setTimeout(() => { dirty = false; size(); }, 140); }, { passive: true });
                size();
                if (RM) {
                    /* one still frame — the field exists, it just does not move */
                    rx.globalCompositeOperation = 'lighter';
                    rx.font = FS + 'px "Share Tech Mono", monospace'; rx.textAlign = 'center';
                    cols.forEach(c => {
                        rx.fillStyle = 'rgba(255,0,85,.34)';
                        rx.fillText(GLY[(Math.random() * GLY.length) | 0], c.x, c.y);
                    });
                    rcv.style.opacity = .4;
                } else {
                    raf = requestAnimationFrame(t => { last = t; frame(t); });
                    document.addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });
                }
            }
            return {
                setMode(m) { mode = m; applyLook(); },
                boost(k) { energy = Math.max(energy, k || 2); applyLook(); },
                get mode() { return mode; }
            };
        })();

    </script>
</body>
